<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サーバー認証</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #2c2f33; color: white; margin: 0; }
        .container { background: #23272a; padding: 2rem; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 1rem; }
        button { margin-top: 1rem; padding: 10px 20px; background-color: #5865F2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>認証が必要です</h1>
        <p>以下のチェックボックスをオンにして、認証ボタンを押してください。</p>
        <form action="/verify/submit" method="POST">
            <input type="hidden" name="token" value="{token}">
            <!-- Site Key is injected by server -->
            <div class="cf-turnstile" data-sitekey="{site_key}" data-theme="dark"></div>
            <br>
            <button type="submit">認証してサーバーに参加</button>
        </form>
    </div>
</body>
</html>
